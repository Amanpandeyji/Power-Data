name: Python Data Analysis CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8 (if installed)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 scripts --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 scripts --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
      continue-on-error: true
    
    - name: Run Data Cleaning Script
      run: |
        python scripts/data_cleaning.py
    
    - name: Verify Cleaned Data Created
      run: |
        python -c "import os; assert os.path.exists('data/cleaned_sales_data.csv'), 'Cleaned data file not created'"
    
    - name: Run Quick Analysis
      run: |
        python scripts/quick_analysis.py
      continue-on-error: true
    
    - name: Check Code Quality
      run: |
        pip install pylint
        pylint scripts/*.py --exit-zero
      continue-on-error: true

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort
    
    - name: Check code formatting with black
      run: |
        black --check scripts/
      continue-on-error: true
    
    - name: Check import sorting with isort
      run: |
        isort --check-only scripts/
      continue-on-error: true
